[project]
name = "k4-day12-chat-service"
version = "1.0.0"
description = "K4 Day 12 FastAPI Chat Service Cloud Infrastructure & Deployment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "redis>=5.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "fakeredis>=2.21",
    "pyyaml>=6.0",
]
